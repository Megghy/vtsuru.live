# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Bun CI

on:
  push:
    branches: [master]

env:
  DOCKERHUB_SLUG: megghy/vtsuru_live
  GHCR_SLUG: ghcr.io/megghy/vtsuru_live

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Use bun
        uses: oven-sh/setup-bun@v2

      - name: 📥 Install dependencies
        run: bun install

      - name: Check generated API types
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          pattern='^(openapi\.json|orval\.config\.ts|scripts/check-api-gen\.mjs|src/api/generated/)'
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --depth=1 origin "$BEFORE" && ! git diff --name-only "$BEFORE" HEAD | grep -Eq "$pattern"; then
              echo "skip api:check (no OpenAPI/generated changes)"
              exit 0
            fi
          fi
          bun run api:check

      - name: Test
        run: bun run test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: time
        with:
          format: YYYYMMDD_HHmmss
          utcOffset: '+08:00'

      - name: Build Docker image and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.GHCR_SLUG }}:latest
            ${{ env.GHCR_SLUG }}:${{ steps.time.outputs.formattedTime }}
