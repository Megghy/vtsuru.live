name: Event Fetcher Image

on:
  push:
    branches: [master]
    paths:
      - packages/danmaku/**
      - packages/event-fetcher/**
      - .github/workflows/event-fetcher-image.yml
  workflow_dispatch:

env:
  GHCR_SLUG: ghcr.io/megghy/vtsuru-event-fetcher

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: time
        with:
          format: YYYYMMDD_HHmmss
          utcOffset: '+08:00'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages
          file: packages/event-fetcher/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_SLUG }}:latest
            ${{ env.GHCR_SLUG }}:${{ steps.time.outputs.formattedTime }}
          labels: |
            org.opencontainers.image.source=https://github.com/Megghy/vtsuru.live
            org.opencontainers.image.description=VTsuru TypeScript event fetcher
